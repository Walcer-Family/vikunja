# Walcer family build: pushes ghcr.io/walcer-family/vikunja:<branch> and
# :<branch>-<sha7> for `walcer` (branding only) and `walcer-deploy` (the
# integration branch that merges walcer + walcer-viz; this is what runs). This file only exists on
# our fork, so it never conflicts with upstream when we rebase.
name: Walcer image

on:
  push:
    branches: [walcer, walcer-deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version string
        id: ver
        run: echo "describe=$(git describe --tags --always)-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/walcer-family/vikunja
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,prefix=${{ github.ref_name }}-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.ver.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
