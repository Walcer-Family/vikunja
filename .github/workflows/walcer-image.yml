# Walcer family build: builds the reskinned image from the `walcer` branch
# and pushes it to ghcr.io/walcer-family/vikunja. This file only exists on
# our fork, so it never conflicts with upstream when we rebase.
name: Walcer image

on:
  push:
    branches: [walcer]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version string
        id: ver
        run: echo "describe=$(git describe --tags --always)-walcer" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/walcer-family/vikunja
          tags: |
            type=raw,value=walcer
            type=sha,prefix=walcer-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.ver.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
